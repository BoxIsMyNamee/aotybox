name: AOTYClient
options:
  bundleIdPrefix: com.harper
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  AOTYClient:
    type: application
    platform: iOS
    sources:
      - path: AOTYClient
        excludes: ["Scripts/**", "Art/**"]
      - path: AOTYClient/Scripts/extract.js
        buildPhase: resources
      - path: AOTYClient/Scripts/genius.js
        buildPhase: resources
      - path: AOTYClient/Art/aoty-logo@3x.png
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.harper.aotyclient
            CFBundleURLSchemes: [aotybox]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.harper.aotyclient
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: AOTY
        INFOPLIST_KEY_NSAppleMusicUsageDescription: "Shows the song playing in Apple Music or Marvis so you can open it in Learn."
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
