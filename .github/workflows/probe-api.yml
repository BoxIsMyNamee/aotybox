name: Probe API

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/probe-api.yml]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe community API and AOTY
        run: |
          UA="AOTYClient-iOS/0.1 (personal client; data: albumoftheyear.org via unofficial AOTY API)"
          for p in "/health" "/status" "/releases?page=1" "/releases/this-week?page=1" "/upcoming?page=1" \
                   "/ratings?source=6-highest-rated&period=2026&page=1" "/search/albums?q=radiohead" \
                   "/album?slug=2915-outkast-aquemini&minimal=true"; do
            echo "=== $p"
            curl -sS -m 30 -A "$UA" -o body.txt -w "HTTP %{http_code} in %{time_total}s\n" "https://aoty.prigoana.com$p"
            head -c 600 body.txt; echo
          done
          echo "=== same, default curl UA"
          curl -sS -m 30 -o body.txt -w "HTTP %{http_code}\n" "https://aoty.prigoana.com/releases?page=1"; head -c 400 body.txt; echo
          echo "=== AOTY direct"
          curl -sS -m 30 -A "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1" \
            -o aoty.html -w "HTTP %{http_code}\n" "https://www.albumoftheyear.org/releases/"
          head -c 400 aoty.html; echo
          grep -o "<title>[^<]*" aoty.html | head -1
