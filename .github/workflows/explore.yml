name: Explore
on:
  workflow_dispatch:
  push:
    paths: ["tests/explore.mjs"]
jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save linkedom@0.18
      - run: node tests/explore.mjs
