name: Test extractors

on:
  push:
    paths: ["AOTYClient/Scripts/**", "tests/**", ".github/workflows/test-extract.yml"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save linkedom@0.18
      - run: node tests/probe.mjs || true
      - run: node tests/extract.test.mjs
