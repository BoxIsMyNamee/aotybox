name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || true

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project AOTYClient.xcodeproj \
            -scheme AOTYClient \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee build.log | grep -E "error:|warning:|BUILD" || true
          # The .app folder exists even after a failed compile, so check Xcode's verdict.
          grep -q "\*\* BUILD SUCCEEDED \*\*" build.log
          test -f build/Build/Products/Release-iphoneos/AOTYClient.app/AOTYClient

      - name: Show toolchain and linked libraries
        run: |
          xcodebuild -version
          otool -L build/Build/Products/Release-iphoneos/AOTYClient.app/AOTYClient | grep -i -E "swift|webkit"
          # libswiftWebKit isn't on iOS 18; linking it crashes the app at launch.
          if otool -L build/Build/Products/Release-iphoneos/AOTYClient.app/AOTYClient | grep -q libswiftWebKit; then
            echo "::error::App links libswiftWebKit (iOS 26+ only) and will crash on iOS 18"; exit 1
          fi
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AOTYClient.app Payload/
          zip -qry AOTYClient.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AOTYClient-ipa
          path: AOTYClient.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
